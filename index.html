    <style>

        .responsive-background {
            background-image: url('images/deuerrado1x.webp');
        }

            .responsive-background {

        }
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            .responsive-background {
                background-image: url('images/deuerrado2x.webp');
            }
        }
        @media (-webkit-min-device-pixel-ratio: 3), (min-resolution: 288dpi) {
            .responsive-background {
                background-image: url('images/deuerrado3x.webp');
            }
        }
        @media (-webkit-min-device-pixel-ratio: 4), (min-resolution: 384dpi) {
            .responsive-background {
                background-image: url('images/deuerrado4x.webp');
            }
        }
    </style>
</head>
